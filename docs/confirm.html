<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>確認・投稿 | 現場問題提起ツール</title>
  <link rel="stylesheet" href="confirm.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main class="app-shell">
    <section class="card">
      <p class="eyebrow">現場問題提起ツール</p>
      <h1>投稿内容の確認</h1>

      <div id="summary" class="summary"></div>

      <label class="label" for="targetDepartment">対象部署</label>
      <select id="targetDepartment"></select>

      <div class="actions">
        <button id="backBtn" class="btn secondary" type="button">戻る</button>
        <button id="submitBtn" class="btn primary" type="button">投稿する</button>
      </div>

      <p id="status" class="status"></p>
    </section>
  </main>
  <script src="confirm.js"></script>
</body>
</html>
