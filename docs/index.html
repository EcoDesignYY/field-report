<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>現場問題提起ツール v0.1</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>現場問題提起</h1>
      <p>画像・音声を添付して現場の気づきを投稿します。</p>
    </header>

    <section class="card">
      <h2>1. 投稿内容</h2>

      <label class="label" for="titleInput">件名 <span class="required">必須</span></label>
      <input id="titleInput" class="input" type="text" placeholder="例：第二ライン搬送装置の異音">

      <label class="label" for="memoInput">メモ</label>
      <textarea id="memoInput" class="textarea" placeholder="気づいた内容、発生状況、補足など"></textarea>
    </section>

    <section class="card">
      <h2>2. 画像</h2>

      <div class="button-row">
        <button id="startCameraButton" type="button">カメラ起動</button>
        <button id="captureButton" type="button" disabled>撮影</button>
        <button id="stopCameraButton" type="button" disabled>カメラ停止</button>
      </div>

      <video id="cameraVideo" class="video" autoplay playsinline muted></video>

      <div class="separator">または</div>

      <label class="label" for="imageFileInput">画像ファイルを選択</label>
      <input id="imageFileInput" type="file" accept="image/*">

      <canvas id="captureCanvas" class="hidden"></canvas>

      <div id="imagePreviewArea" class="preview-area hidden">
        <p class="preview-title">画像プレビュー</p>
        <img id="imagePreview" alt="画像プレビュー">
        <button id="clearImageButton" type="button" class="secondary">画像を削除</button>
      </div>
    </section>

    <section class="card">
      <h2>3. 音声</h2>

      <div class="button-row">
        <button id="startRecordingButton" type="button">録音開始</button>
        <button id="stopRecordingButton" type="button" disabled>録音停止</button>
        <button id="clearAudioButton" type="button" class="secondary" disabled>音声を削除</button>
      </div>

      <div class="recording-info">
        <span id="recordingStatus">未録音</span>
        <span id="recordingTimer">00:00</span>
      </div>

      <audio id="audioPlayer" controls class="audio"></audio>

      <p class="note">録音上限は60秒です。</p>
    </section>

    <section class="card">
      <h2>4. 投稿</h2>

      <button id="submitButton" type="button" class="primary">投稿する</button>

      <div id="statusBox" class="status-box">
        GAS入口から開いてください。
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
