<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>録音 | 現場問題提起ツール</title>
  <link rel="stylesheet" href="record.css">
</head>
<body>
  <main class="app-shell">
    <section class="card">
      <p class="eyebrow">現場問題提起ツール</p>
      <h1>音声を録音</h1>
      <p class="lead">発生した問題や気づいた点を話してください。最大2分まで録音できます。</p>

      <div class="rec-panel">
        <div id="timer" class="timer">00:00</div>
        <div id="recState" class="rec-state">待機中</div>
        <audio id="audioPreview" controls hidden></audio>
      </div>

      <div class="actions">
        <button id="backBtn" class="btn secondary" type="button">戻る</button>
        <button id="startBtn" class="btn primary" type="button">録音開始</button>
        <button id="stopBtn" class="btn danger" type="button" disabled>停止</button>
        <button id="nextBtn" class="btn primary" type="button" disabled>画像撮影へ</button>
      </div>

      <p id="status" class="status"></p>
    </section>
  </main>
  <script src="record.js"></script>
</body>
</html>
