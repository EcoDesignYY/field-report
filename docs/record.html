<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <title>録音</title>
  <link
    rel="stylesheet"
    href="./record.css?v=workflow-v164-attachment-ai"
  >
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <button
        id="backButton"
        type="button"
        class="top-button"
      >
        戻る
      </button>
      <div class="top-title">録音</div>
      <button
        id="helpButton"
        type="button"
        class="top-button"
      >
        ヘルプ
      </button>
    </header>

    <main class="content">
      <section class="hero-card">
        <div
          id="recordStatusBadge"
          class="status-badge status-ready"
        >
          マイク準備中
        </div>
        <h1>現場の状況を音声で記録</h1>
        <p>
          異音・不具合・違和感などを、見たまま・聞いたまま話してください。
        </p>
      </section>

      <section class="recorder-card">
        <div id="timerText" class="timer">00:00</div>

        <div class="wave-wrap">
          <canvas
            id="waveCanvas"
            width="600"
            height="150"
            aria-label="録音波形"
          ></canvas>
        </div>

        <div class="main-control">
          <button
            id="recordButton"
            type="button"
            class="record-button"
            aria-label="録音開始"
          >
            <span id="recordIcon" class="record-icon"></span>
          </button>
          <div id="recordLabel" class="record-label">録音開始</div>
        </div>

        <div class="sub-controls">
          <button
            id="pauseButton"
            type="button"
            class="secondary-button"
            disabled
          >
            一時停止
          </button>
          <button
            id="resetButton"
            type="button"
            class="secondary-button"
            disabled
          >
            やり直し
          </button>
        </div>

        <div id="audioPreviewArea" class="audio-preview hidden">
          <div class="audio-player">
            <button
              id="playAudioButton"
              type="button"
              class="secondary-button compact"
              disabled
            >
              再生
            </button>
            <span id="audioPlayStatus">未録音</span>
          </div>
          <audio id="audioPlayer" preload="metadata"></audio>
        </div>
      </section>

      <section class="memo-card">
        <label for="audioMemoInput">補足事項</label>
        <textarea
          id="audioMemoInput"
          rows="4"
          placeholder="補足があれば入力してください。例：第二ライン右側、朝一から異音あり"
        ></textarea>
      </section>

      <section class="attachment-card">
        <div class="section-head">
          <div>
            <h2>関連ファイル</h2>
            <p>録音に加えてPDF、画像、音声、動画、テキスト等を最大5件添付できます。1ファイル12MiB、撮影画像を含む合計12MiBです。</p>
          </div>
          <button id="selectAttachmentsButton" type="button" class="secondary-button">ファイルを選択</button>
        </div>
        <input id="attachmentFileInput" type="file" multiple class="hidden">
        <div class="usage-row"><strong id="attachmentCount">0 / 5件</strong><span id="attachmentUsage">0 B / 12 MiB</span></div>
        <div id="attachmentList" class="attachment-list"></div>
        <p id="attachmentEmpty" class="empty-message">添付ファイルはありません。</p>
      </section>

      <section class="tips-card">
        <h2>録音の目安</h2>
        <ul>
          <li>
            録音時間は30秒以上2分以内です。2分に達すると自動停止します。
          </li>
          <li>
            対象物・発生場所・いつから起きたかを話すとAI整理しやすくなります。
          </li>
          <li>
            録音中はカメラを停止するため、録音後に撮影へ進みます。
          </li>
        </ul>
      </section>

      <div id="statusBox" class="status-box hidden"></div>
    </main>

    <footer class="bottom-actions">
      <button
        id="nextButton"
        type="button"
        class="primary-button"
        disabled
      >
        保存して次へ
      </button>
    </footer>
  </div>

  <script src="./record.js?v=workflow-v170"></script>
</body>
</html>
