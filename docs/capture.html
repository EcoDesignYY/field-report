<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>画像添付 | 現場問題提起ツール</title>
  <link rel="stylesheet" href="capture.css">
</head>
<body>
  <main class="app-shell">
    <section class="card">
      <p class="eyebrow">現場問題提起ツール</p>
      <h1>画像を添付</h1>
      <p class="lead">現場写真を撮影、または画像ファイルを選択してください。画像なしでも投稿できます。</p>

      <video id="video" playsinline autoplay muted hidden></video>
      <canvas id="canvas" hidden></canvas>
      <img id="preview" class="preview" alt="添付画像プレビュー" hidden>

      <div class="actions grid">
        <button id="startCameraBtn" class="btn secondary" type="button">カメラ起動</button>
        <button id="captureBtn" class="btn primary" type="button" disabled>撮影</button>
        <label class="btn secondary file-label">画像選択<input id="fileInput" type="file" accept="image/*" hidden></label>
        <button id="clearBtn" class="btn secondary" type="button">画像クリア</button>
      </div>

      <div class="actions">
        <button id="backBtn" class="btn secondary" type="button">戻る</button>
        <button id="nextBtn" class="btn primary" type="button">確認へ</button>
      </div>

      <p id="status" class="status"></p>
    </section>
  </main>
  <script src="capture.js"></script>
</body>
</html>
