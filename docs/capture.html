<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <title>撮影・添付</title>
  <link
    rel="stylesheet"
    href="./capture.css?v=workflow-v152-readable"
  >
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <button
        id="backButton"
        type="button"
        class="top-button"
      >
        戻る
      </button>
      <div class="top-title">撮影・添付</div>
      <button
        id="helpButton"
        type="button"
        class="top-button"
      >
        ヘルプ
      </button>
    </header>

    <main class="content">
      <section class="hero-card">
        <div
          id="cameraStatusBadge"
          class="status-badge status-ready"
        >
          画像は任意です
        </div>
        <h1>現場の状況を写真で記録</h1>
        <p>
          対象が分かるように撮影してください。画像なしでも次へ進めます。
        </p>
      </section>

      <section class="camera-card">
        <div class="preview-card">
          <video
            id="cameraVideo"
            autoplay
            playsinline
            muted
            class="hidden"
          ></video>
          <img
            id="imagePreview"
            alt="撮影画像プレビュー"
            class="hidden"
          >
          <div id="emptyPreview" class="empty-preview">
            カメラを起動、または画像を選択してください
          </div>
          <canvas id="captureCanvas" class="hidden"></canvas>
        </div>

        <div class="capture-controls">
          <button
            id="startCameraButton"
            type="button"
            class="secondary-button"
          >
            カメラ起動
          </button>
          <button
            id="captureButton"
            type="button"
            class="primary-button"
            disabled
          >
            撮影
          </button>
          <button
            id="fileSelectButton"
            type="button"
            class="secondary-button"
          >
            画像を選択
          </button>
        </div>

        <div class="sub-controls">
          <button
            id="resetImageButton"
            type="button"
            class="secondary-button"
            disabled
          >
            画像を削除
          </button>
          <button
            id="stopCameraButton"
            type="button"
            class="secondary-button"
            disabled
          >
            カメラ停止
          </button>
        </div>

        <input
          id="imageFileInput"
          type="file"
          accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
          class="hidden"
        >

        <div class="image-info">
          <strong id="imageSizeText">画像なし</strong>
          <span id="totalUsageText">
            投稿ファイル合計 0 B / 12 MiB
          </span>
        </div>
      </section>

      <section class="memo-card">
        <label for="imageMemoInput">画像メモ</label>
        <textarea
          id="imageMemoInput"
          rows="3"
          placeholder="例：第二ライン右側、赤丸部分に摩耗あり"
        ></textarea>
      </section>

      <div id="statusBox" class="status-box hidden"></div>
    </main>

    <footer class="bottom-actions">
      <button
        id="nextButton"
        type="button"
        class="primary-button"
      >
        確認へ進む
      </button>
    </footer>
  </div>

  <script src="./capture.js?v=workflow-v152-readable"></script>
</body>
</html>
