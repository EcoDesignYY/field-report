<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>テキスト入力</title>
  <link rel="stylesheet" href="./text.css?v=readable-old-ui-v4">
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <button id="backButton" type="button" class="top-button">戻る</button>
      <div class="top-title">テキスト入力</div>
      <button id="helpButton" type="button" class="top-button">ヘルプ</button>
    </header>

    <main class="content">
      <section class="hero-card">
        <div id="inputStatusBadge" class="status-badge status-ready">入力できます</div>
        <h1>現場の状況を文章で記録</h1>
        <p>発生場所、対象物、症状、発生時期、困っていることを分かる範囲で入力してください。</p>
      </section>

      <section class="text-card">
        <label for="textBodyInput">問題内容</label>
        <textarea
          id="textBodyInput"
          rows="12"
          maxlength="4000"
          placeholder="例：第二ラインの搬送ベルト右側から異音がします。今朝の始業時から発生し、運転速度を上げると音が大きくなります。"
        ></textarea>
        <div class="text-footer">
          <span>10文字以上入力してください。</span>
          <span id="characterCount">0 / 4000</span>
        </div>
      </section>

      <section class="tips-card">
        <h2>入力の目安</h2>
        <ul>
          <li>確認できた事実と推測を分けて入力してください。</li>
          <li>いつ、どこで、何が、どのようになったかを含めてください。</li>
          <li>次の画面で写真を撮影または添付できます。</li>
        </ul>
      </section>

      <div id="statusBox" class="status-box hidden"></div>
    </main>

    <footer class="bottom-actions">
      <button id="nextButton" type="button" class="primary-button" disabled>保存して次へ</button>
    </footer>
  </div>

  <script src="./text.js?v=readable-old-ui-v4"></script>
</body>
</html>
